            theme: {
                extend: {
                    fontFamily: {

        }

            -webkit-backdrop-filter: blur(12px);

        }
        .dark .card-hover:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

                    </p>

            <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">

    <!-- Main Content Grid -->

        <div class="flex justify-between items-center mb-6">

        <!-- Cards Grid -->
        <div id="aiGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Dynamic JavaScript injection -->
        </div>

        <!-- No results found state -->
        <div id="noResults" class="hidden py-20 text-center space-y-4">
            <div class="w-16 h-16 mx-auto rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-400 text-2xl">

    </main>

    <!-- Footer -->

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2">

            </div>

                <span>由青竹制作</span>

            {

                desc_en: "Microsoft's enterprise productivity AI assistant seamlessly embedded across Windows and Microsoft 365 apps.",

                tags_en: ['Microsoft', 'Office 365', 'Productivity', 'Windows']
            },
            {
                id: 'notionai',
                name: 'Notion AI',
                category: 'productivity',
                url: 'https://www.notion.so',
                domain: 'notion.so',
                desc_zh: '内置于 Notion 笔记工作区的智能写作与知识管理助手，助力大纲整理、翻译与摘要。',
                desc_en: 'Intelligent writing and knowledge management assistant built right into Notion workspaces for notes and summaries.',
                tags_zh: ['笔记', '知识库', '智能写作', '效率工具'],
                tags_en: ['Notes', 'Knowledge Base', 'Writing', 'Productivity']
            },
            {
                id: 'grok',
                name: 'Grok (xAI)',
                category: 'llm',
                url: 'https://grok.x.ai',
                domain: 'grok.x.ai',
                desc_zh: '由 xAI 开发的幽默且具备实时社交媒体洞察的对话大模型，拥有强大的全网资讯获取能力。',
                desc_en: 'Conversational AI developed by xAI with real-time social media insights and witty personality.',
                tags_zh: ['xAI', '马斯克', '实时资讯', '对话模型'],
                tags_en: ['xAI', 'Real-time', 'Social Insights', 'Chat']
            }
        ];

        // Global State
        let currentLang = 'zh'; // 'zh' or 'en'
        let currentCategory = 'all';
        let searchQuery = '';

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            renderTools();
            updateLanguageUI();
        });

        // Toggle Language function
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateLanguageUI();
            renderTools();
        }

        // Update static UI elements based on current language
        function updateLanguageUI() {
            const langIndicator = document.getElementById('langIndicator');
            langIndicator.innerText = currentLang === 'zh' ? 'EN / 中文' : '中文 / EN';

            const searchInput = document.getElementById('searchInput');
            searchInput.placeholder = currentLang === 'zh' 
                ? '搜索 AI 工具名称或关键词 (例: ChatGPT, 绘画, 视频)...' 
                : 'Search AI tools by name or keyword (e.g., ChatGPT, art, video)...';

            // Update all elements with class 'lang-text'
            document.querySelectorAll('.lang-text').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if (text) {
                    el.innerText = text;
                }
            });
        }

        // Filter by category
        function filterCategory(category) {
            currentCategory = category;
            
            // Update active pill styling
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.getAttribute('data-category') === category) {
                    btn.className = 'category-btn active px-4 py-2 rounded-xl text-sm font-medium transition-all bg-indigo-600 text-white shadow-md shadow-indigo-500/20';
                } else {
                    btn.className = 'category-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 dark:hover:border-indigo-500';
                }
            });

            renderTools();
        }

        // Filter on search input
        function filterTools() {
            const input = document.getElementById('searchInput');
            searchQuery = input.value.trim().toLowerCase();
            
            const clearBtn = document.getElementById('clearSearchBtn');
            if (searchQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            renderTools();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderTools();
        }

        // Toggle Theme
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
            } else {
                html.classList.add('dark');
            }
        }

        // Render AI cards to grid
        function renderTools() {
            const grid = document.getElementById('aiGrid');
            const noResults = document.getElementById('noResults');
            const resultsCount = document.getElementById('resultsCount');

            // Filter tools
            const filtered = aiTools.filter(tool => {
                const matchesCategory = currentCategory === 'all' || tool.category === currentCategory;
                const matchesSearch = searchQuery === '' || 
                    tool.name.toLowerCase().includes(searchQuery) ||
                    tool.desc_zh.toLowerCase().includes(searchQuery) ||
                    tool.desc_en.toLowerCase().includes(searchQuery) ||
                    tool.tags_zh.some(t => t.toLowerCase().includes(searchQuery)) ||
                    tool.tags_en.some(t => t.toLowerCase().includes(searchQuery));
                return matchesCategory && matchesSearch;
            });

            resultsCount.innerText = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            // Category display labels mapping
            const catLabelsZh = {
                'llm': '大模型与对话',
                'image': '图像与视频',
                'productivity': '效率与代码',
                'audio': '音频与语音'
            };
            const catLabelsEn = {
                'llm': 'LLM & Chat',
                'image': 'Image & Video',
                'productivity': 'Productivity & Code',
                'audio': 'Audio & Voice'
            };

            grid.innerHTML = filtered.map(tool => {
                const desc = currentLang === 'zh' ? tool.desc_zh : tool.desc_en;
                const tags = currentLang === 'zh' ? tool.tags_zh : tool.tags_en;
                const catLabel = currentLang === 'zh' ? catLabelsZh[tool.category] : catLabelsEn[tool.category];
                const visitText = currentLang === 'zh' ? '访问平台' : 'Visit Site';
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${tool.domain}&sz=128`;

                return `
                    <div class="card-hover bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 rounded-2xl p-5 flex flex-col justify-between shadow-sm">
                        <div>
                            <div class="flex items-start justify-between mb-4">
                                <div class="flex items-center space-x-3">
                                    <div class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center p-2.5 border border-slate-200 dark:border-slate-700/60 shadow-inner overflow-hidden">
                                        <img src="${faviconUrl}" alt="${tool.name} logo" class="w-7 h-7 object-contain" onerror="this.onerror=null; this.src='https://placehold.co/64x64/6366f1/ffffff?text=${tool.name.charAt(0)}';">
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-base text-slate-900 dark:text-white leading-snug">${tool.name}</h3>
                                        <span class="inline-block mt-1 px-2.5 py-0.5 rounded-md text-[11px] font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 border border-indigo-100 dark:border-indigo-900/50">
                                            ${catLabel}
                                        </span>
                                    </div>
                                </div>
                            </div>
                            
                            <p class="text-sm text-slate-600 dark:text-slate-400 line-clamp-3 mb-4 leading-relaxed">
                                ${desc}
                            </p>
                        </div>

                        <div>
                            <div class="flex flex-wrap gap-1.5 mb-4">
                                ${tags.map(tag => `<span class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-[11px] font-medium">#${tag}</span>`).join('')}
                            </div>

                            <a href="${tool.url}" target="_blank" rel="noopener noreferrer" class="w-full inline-flex items-center justify-center space-x-2 py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-slate-800 hover:bg-indigo-600 dark:hover:bg-indigo-600 text-white text-sm font-semibold transition-colors shadow-sm group">
                                <span>${visitText}</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400 group-hover:text-white transition-colors"></i>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
