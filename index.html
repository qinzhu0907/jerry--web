<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jerry 智能水杯 - 付款演示站，支持微信支付接口演示与 Cloudflare Pages 部署。"
    />
    <title>Jerry 智能水杯 | 微信支付演示</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="logo">J</div>
          <span>Jerry Studio</span>
        </div>
        <button class="ghost-btn">立即购买</button>
      </header>

      <main class="hero">
        <section class="product-copy">
          <span class="eyebrow">智能健康生活 · 新品推荐</span>
          <h1>Jerry 智能水杯</h1>
          <p class="lead">
            24小时智能提醒饮水，温度感知，水质追踪，带来更健康高效的日常习惯。
          </p>

          <div class="feature-list">
            <div>
              <strong>12H</strong>
              <span>温控续航</span>
            </div>
            <div>
              <strong>3种</strong>
              <span>饮水模式</span>
            </div>
            <div>
              <strong>APP</strong>
              <span>智能追踪</span>
            </div>
          </div>

          <div class="pricing-row">
            <div>
              <span class="old-price">¥399</span>
              <span class="price">¥299</span>
            </div>
            <span class="badge">限时优惠</span>
          </div>
        </section>

        <aside class="checkout-card">
          <div class="card-header">
            <div>
              <p class="small-label">精选商品</p>
              <h2>Jerry 智能水杯</h2>
            </div>
            <div class="product-thumb">💧</div>
          </div>

          <div class="quantity-row">
            <label for="quantity">数量</label>
            <div class="stepper" aria-label="数量选择器">
              <button type="button" class="step-btn" data-action="minus">−</button>
              <input id="quantity" type="number" min="1" value="1" />
              <button type="button" class="step-btn" data-action="plus">＋</button>
            </div>
          </div>

          <div class="summary-row">
            <span>商品金额</span>
            <strong id="subtotal">¥299</strong>
          </div>
          <div class="summary-row">
            <span>运费</span>
            <strong>¥0</strong>
          </div>
          <div class="summary-row total-row">
            <span>实付金额</span>
            <strong id="total">¥299</strong>
          </div>

          <button id="checkoutBtn" class="primary-btn">使用微信支付</button>
          <button id="mockBtn" class="secondary-btn" type="button">演示支付</button>

          <div id="statusBox" class="status-box hidden" aria-live="polite"></div>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
