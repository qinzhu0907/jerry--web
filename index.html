<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><meta name="description" content="精选手游展示与游戏活动信息。"><title>推荐游戏 · 游享</title><link rel="stylesheet" href="./styles.css"><script src="./app.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="#"><span class="brand-mark">游</span><span>推荐游戏</span></a><form id="searchForm" class="searchbar"><input id="searchInput" type="search" placeholder="搜索游戏名称" aria-label="搜索游戏名称"><button type="submit"><span>⌕</span> 搜索</button></form><button class="admin-trigger" id="adminOpen">管理入口</button></header>
<main class="page"><div class="toolbar"><div id="filters" class="filters"><button class="filter active" data-category="全部">全部游戏</button></div><span class="count">共 <b id="resultsCount">0</b> 款游戏</span></div><section class="game-grid" id="gamesGrid" aria-live="polite"></section><section class="empty" id="emptyState" hidden><div class="empty-symbol">游</div><h2>游戏内容正在准备中</h2><p>请稍后再来查看推荐游戏。</p></section><section class="empty" id="noResults" hidden><div class="empty-symbol">⌕</div><h2>没有找到相关游戏</h2><p>试试其他游戏名称或分类。</p></section></main>
<footer class="footer"><span>游享 · 推荐游戏</span><span>游戏详情及活动规则以对应页面公布的信息为准。</span><button id="footerAdmin">管理入口</button></footer>
<div class="backdrop" id="detailModal" hidden><section class="panel detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><button class="close" data-close="detailModal" aria-label="关闭">×</button><div id="detailContent"></div></section></div>
<div class="backdrop" id="adminModal" hidden><section class="panel admin-panel" role="dialog" aria-modal="true" aria-labelledby="adminTitle"><button class="close" data-close="adminModal" aria-label="关闭">×</button>
<div id="loginView"><small class="overline">内容管理</small><h2 id="adminTitle">管理员登录</h2><p class="intro">登录后可管理网站展示的游戏内容。</p><form id="loginForm" class="form"><label>管理员密码<input id="adminPassword" type="password" autocomplete="current-password" required minlength="12" placeholder="请输入管理员密码"></label><button class="primary wide" type="submit">登录后台</button><p id="loginMessage" class="message"></p></form></div>
<div id="dashboardView" hidden><div class="dashboard-head"><div><small class="overline">内容管理</small><h2>游戏管理</h2><p class="intro">添加或编辑卡片，保存后更新网站展示。</p></div><button class="secondary" id="logoutButton">退出登录</button></div><div class="admin-list" id="adminGameList"></div><div class="editor-head"><h3 id="editorTitle">添加游戏</h3></div><form id="gameForm" class="form"><input id="gameId" type="hidden"><div class="form-grid"><label>游戏名称 *<input id="nameZh" required maxlength="100" placeholder="游戏名称"></label><label>游戏分类 *<input id="category" required maxlength="60" placeholder="角色扮演、卡牌回合等"></label></div><div class="form-grid"><label>游戏评级<input id="platform" maxlength="100" placeholder="例如：A级"></label><label>卡片标签 *<input id="discount" required maxlength="120" placeholder="例如：新手福利"></label></div><label>游戏简介 *<textarea id="summaryZh" required maxlength="500" rows="3" placeholder="简单介绍游戏内容"></textarea></label><label>详细介绍<textarea id="gameplayZh" maxlength="2000" rows="4" placeholder="玩法介绍、特色内容等"></textarea></label><label>活动规则与注意事项<textarea id="terms" maxlength="1500" rows="3" placeholder="活动时间、参与条件等"></textarea></label><label>卡片封面图片地址<input id="imageUrl" type="url" placeholder="https://..."></label><label>游戏图标图片地址<input id="iconUrl" type="url" placeholder="https://...（可选）"></label><label>详情展示图片地址（每行一条，最多 6 条）<textarea id="galleryUrls" rows="3" placeholder="https://图片地址1&#10;https://图片地址2"></textarea></label><label>游戏详情 / 活动链接 *<input id="promoUrl" type="url" required placeholder="https://..."></label><div class="checks"><label><input id="featured" type="checkbox">精选标记</label><label><input id="active" type="checkbox" checked>公开显示</label></div><div class="form-buttons"><button class="secondary" id="resetForm" type="button">清空</button><button class="primary" type="submit">保存游戏</button></div><p id="gameMessage" class="message"></p></form></div></section></div>
</body></html>
