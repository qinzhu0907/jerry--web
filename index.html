<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的云盘 - My Cloud Netdisk</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tailwind Custom Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            baidu: {
              DEFAULT: '#06a7ff',
              hover: '#008ae6',
              light: '#e8f6ff',
              dark: '#0062a3'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .glass-effect {
      backdrop-filter: blur(8px);
      background-color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col overflow-hidden select-none">

  <!-- ==================== HEADER BAR ==================== -->
  <header class="h-16 bg-white border-b border-slate-200 px-4 flex items-center justify-between z-20 shrink-0">
    <!-- Logo & Title -->
    <div class="flex items-center space-x-3 w-64">
      <div class="w-10 h-10 bg-baidu rounded-xl flex items-center justify-center text-white text-xl shadow-md shadow-blue-200">
        <i class="fa-solid fa-cloud-bolt"></i>
      </div>
      <div>
        <h1 class="font-bold text-slate-800 text-lg leading-tight">我的云盘</h1>
        <p class="text-xs text-slate-400">Cloud Storage</p>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="flex-1 max-w-xl mx-4">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="搜索网盘文件..." 
               class="w-full pl-10 pr-4 py-2 bg-slate-100 hover:bg-slate-200/70 focus:bg-white text-sm rounded-full border border-transparent focus:border-baidu focus:outline-none transition-all">
      </div>
    </div>

    <!-- User Profile & Storage Indicator -->
    <div class="flex items-center space-x-6">
      <!-- Storage Quota -->
      <div class="hidden md:flex flex-col w-36">
        <div class="flex justify-between text-xs mb-1">
          <span class="text-slate-500">容量</span>
          <span id="storageText" class="font-medium text-slate-700">0 GB / 100 GB</span>
        </div>
        <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
          <div id="storageBar" class="bg-baidu h-full transition-all duration-500" style="width: 15%"></div>
        </div>
      </div>

      <!-- User Avatar Badge -->
      <div class="flex items-center space-x-3 border-l border-slate-200 pl-4">
        <div class="relative">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User Avatar" class="w-9 h-9 rounded-full bg-slate-100 border border-slate-200">
          <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <div class="hidden lg:block text-left">
          <div class="text-sm font-semibold text-slate-700">极速VIP用户</div>
          <div class="text-xs text-amber-500 font-medium"><i class="fa-solid fa-crown text-[10px] mr-1"></i>超级会员</div>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN BODY CONTAINER ==================== -->
  <div class="flex flex-1 overflow-hidden">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="w-60 bg-slate-50 border-r border-slate-200 flex flex-col justify-between shrink-0 p-3">
      <!-- Nav Navigation Links -->
      <nav class="space-y-1">
        <a href="#" data-nav="all" class="nav-item flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-baidu text-white shadow-sm shadow-blue-200">
          <i class="fa-solid fa-folder-closed w-5 text-center"></i>
          <span>全部文件</span>
        </a>

        <div class="pt-3 pb-1 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">分类文件</div>
        
        <a href="#" data-nav="image" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition">
          <i class="fa-solid fa-image w-5 text-center text-blue-500"></i>
          <span>图片</span>
        </a>
        <a href="#" data-nav="document" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition">
          <i class="fa-solid fa-file-lines w-5 text-center text-emerald-500"></i>
          <span>文档</span>
        </a>
        <a href="#" data-nav="video" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition">
          <i class="fa-solid fa-film w-5 text-center text-purple-500"></i>
          <span>视频</span>
        </a>
        <a href="#" data-nav="audio" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition">
          <i class="fa-solid fa-music w-5 text-center text-amber-500"></i>
          <span>音乐</span>
        </a>
        <a href="#" data-nav="other" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition">

          <span>其他</span>

        <div class="pt-3 pb-1 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">快捷功能</div>

        <a href="#" data-nav="share" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition">
          <i class="fa-solid fa-share-nodes w-5 text-center text-sky-500"></i>
          <span>我的分享</span>
        </a>
        <a href="#" data-nav="trash" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition">
          <i class="fa-solid fa-trash-can w-5 text-center text-rose-500"></i>
          <span>回收站</span>
        </a>
      </nav>

      <!-- Sidebar Bottom Info Widget -->
      <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm">
        <div class="flex items-center space-x-2 text-slate-700 font-medium text-sm mb-1">
          <i class="fa-solid fa-shield-halved text-baidu"></i>
          <span>安全传输保障</span>
        </div>
        <p class="text-xs text-slate-400">已开启端到端加密传输与云端自动防病毒检测。</p>
      </div>
    </aside>

    <!-- ==================== MAIN BROWSER AREA ==================== -->
    <main class="flex-1 flex flex-col bg-white overflow-hidden relative" id="dropZone">
      
      <!-- Action Toolbar Header -->
      <div class="p-4 border-b border-slate-100 flex flex-wrap gap-3 items-center justify-between bg-white z-10">
        <!-- Action Buttons -->
        <div class="flex items-center space-x-2">
          <!-- Hidden Native Upload Input -->
          <input type="file" id="fileInput" class="hidden" multiple>
          
          <button id="uploadBtn" class="bg-baidu hover:bg-baidu-hover text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 shadow-sm transition active:scale-95">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>上传文件</span>
          </button>

          <button id="newFolderBtn" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-3 py-2 rounded-lg text-sm font-medium flex items-center space-x-1.5 shadow-sm transition active:scale-95">
            <i class="fa-solid fa-folder-plus text-baidu"></i>
            <span>新建文件夹</span>
          </button>

          <!-- Selection Action Group (Shown when items selected) -->
          <div id="selectionActions" class="hidden items-center space-x-2 border-l border-slate-200 pl-3">
            <button id="batchDownloadBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium flex items-center space-x-1.5 transition">
              <i class="fa-solid fa-download text-slate-600"></i>
              <span>下载</span>
            </button>
            <button id="batchShareBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium flex items-center space-x-1.5 transition">
              <i class="fa-solid fa-share-nodes text-slate-600"></i>
              <span>分享</span>
            </button>
            <button id="batchDeleteBtn" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center space-x-1.5 transition">
              <i class="fa-solid fa-trash-can"></i>
              <span>删除</span>
            </button>
          </div>

          <!-- Trash Bin Toolbar Action -->
          <div id="trashActions" class="hidden items-center space-x-2 border-l border-slate-200 pl-3">
            <button id="emptyTrashBtn" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center space-x-1.5 transition">
              <i class="fa-solid fa-broom"></i>
              <span>清空回收站</span>
            </button>
          </div>
        </div>

        <!-- View Controls & Sorting -->
        <div class="flex items-center space-x-2">
          <!-- View Switcher -->
          <div class="bg-slate-100 p-1 rounded-lg flex items-center space-x-1">
            <button id="listViewBtn" class="px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-700 bg-white shadow-sm transition">
              <i class="fa-solid fa-list"></i>
            </button>
            <button id="gridViewBtn" class="px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-500 hover:text-slate-700 transition">
              <i class="fa-solid fa-border-all"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Breadcrumb Bar -->
      <div class="px-4 py-2.5 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between text-xs text-slate-500">
        <div class="flex items-center space-x-2 overflow-x-auto" id="breadcrumb">
          <!-- Dynamic Breadcrumb -->
        </div>
        <div id="fileCountText" class="text-slate-400 shrink-0 ml-2">已加载 0 个项目</div>
      </div>

      <!-- File Content Workspace -->
      <div class="flex-1 overflow-y-auto p-4 relative" id="fileBrowserContainer">
        
        <!-- Drop Zone Overlay Visual -->
        <div id="dropOverlay" class="hidden absolute inset-0 bg-baidu/10 border-2 border-dashed border-baidu z-30 m-4 rounded-xl flex-col items-center justify-center text-baidu pointer-events-none transition-all">
          <i class="fa-solid fa-cloud-arrow-up text-5xl mb-2 animate-bounce"></i>
          <span class="text-lg font-bold">释放文件以立即上传至当前目录</span>
        </div>

        <!-- LIST VIEW -->
        <div id="listView" class="w-full">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-200 text-xs text-slate-400 font-semibold select-none">
                <th class="pb-3 w-10 text-center">
                  <input type="checkbox" id="selectAllCheckbox" class="rounded text-baidu focus:ring-baidu w-4 h-4 cursor-pointer">
                </th>
                <th class="pb-3 cursor-pointer hover:text-slate-600" onclick="sortFiles('name')">文件名 <i class="fa-solid fa-sort text-[10px]"></i></th>
                <th class="pb-3 w-32 cursor-pointer hover:text-slate-600 hidden md:table-cell" onclick="sortFiles('size')">大小 <i class="fa-solid fa-sort text-[10px]"></i></th>
                <th class="pb-3 w-44 cursor-pointer hover:text-slate-600 hidden sm:table-cell" onclick="sortFiles('date')">修改日期 <i class="fa-solid fa-sort text-[10px]"></i></th>
                <th class="pb-3 w-28 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="fileListBody" class="divide-y divide-slate-100 text-sm">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
        </div>

        <!-- GRID VIEW (Initially Hidden) -->
        <div id="gridView" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
          <!-- Dynamically populated cards -->
        </div>

        <!-- Empty State Component -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
          <div class="w-24 h-24 bg-slate-100 text-slate-300 rounded-full flex items-center justify-center text-4xl mb-3">
            <i class="fa-regular fa-folder-open"></i>
          </div>
          <h3 class="text-slate-600 font-semibold text-base">此文件夹为空</h3>
          <p class="text-slate-400 text-xs mt-1">上传文件或拖拽文件到这里开始使用网盘</p>
        </div>

      </div>
    </main>

  </div>

  <!-- ==================== UPLOADING PROGRESS DRAWER ==================== -->
  <div id="uploadDrawer" class="fixed bottom-4 right-4 w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 z-40 transition-all duration-300 transform translate-y-full opacity-0">
    <div class="p-3 border-b border-slate-100 flex items-center justify-between bg-slate-50 rounded-t-2xl">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-circle-notch animate-spin text-baidu"></i>
        <span class="text-sm font-semibold text-slate-700" id="uploadDrawerTitle">正在上传文件...</span>
      </div>
      <button id="closeUploadDrawer" class="text-slate-400 hover:text-slate-600 p-1">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="uploadList" class="max-h-60 overflow-y-auto p-3 space-y-3">
      <!-- Upload items dynamically injected -->
    </div>
  </div>

  <!-- ==================== MODALS ==================== -->

  <!-- Folder Creation Modal -->
  <div id="folderModal" class="fixed inset-0 bg-slate-900/40 glass-effect z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-150">
      <h3 class="text-lg font-bold text-slate-800 mb-4">新建文件夹</h3>
      <input type="text" id="newFolderName" placeholder="请输入文件夹名称" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-baidu mb-5" value="新建文件夹">
      <div class="flex justify-end space-x-3">
        <button id="cancelFolderBtn" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">取消</button>
        <button id="confirmFolderBtn" class="px-4 py-2 rounded-lg text-sm font-medium bg-baidu text-white hover:bg-baidu-hover shadow-sm">确定</button>
      </div>
    </div>
  </div>

  <!-- File Share Modal -->
  <div id="shareModal" class="fixed inset-0 bg-slate-900/40 glass-effect z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-slate-800">创建私密分享链接</h3>
        <button id="closeShareModal" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">分享文件</label>
          <div id="shareFileName" class="p-2.5 bg-slate-50 rounded-lg font-medium text-slate-700 truncate">--</div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">有效期</label>
            <select id="shareExpire" class="w-full border border-slate-300 rounded-lg p-2 text-slate-700 focus:outline-none focus:border-baidu">
              <option value="7">7 天有效</option>
              <option value="1">1 天有效</option>
              <option value="30">30 天有效</option>
              <option value="0">永久有效</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">提取码 (自选/随机)</label>
            <input type="text" id="shareCode" maxlength="4" class="w-full border border-slate-300 rounded-lg p-2 text-slate-700 uppercase font-mono text-center focus:outline-none focus:border-baidu" placeholder="a1b2">
          </div>
        </div>

        <div id="shareResultBox" class="hidden p-3 bg-blue-50 border border-blue-200 rounded-xl space-y-2">
          <div class="text-xs text-blue-700 font-semibold">链接及提取码生成成功:</div>
          <input type="text" id="generatedShareUrl" readonly class="w-full text-xs p-2 bg-white border border-blue-200 rounded text-slate-600 select-all font-mono">
        </div>

        <div class="flex justify-end space-x-3 pt-2">
          <button id="generateShareBtn" class="w-full py-2.5 rounded-lg text-sm font-medium bg-baidu text-white hover:bg-baidu-hover shadow-sm">复制链接及提取码</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Media / File Lightbox Previewer Modal -->
  <div id="previewModal" class="fixed inset-0 bg-slate-950/80 glass-effect z-50 hidden flex-col items-center justify-center p-4">
    <!-- Close & Action Bar -->
    <div class="absolute top-4 right-4 flex items-center space-x-3 z-10">
      <a id="previewDownloadBtn" href="#" download class="p-2.5 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full transition"><i class="fa-solid fa-download"></i></a>
      <button id="closePreviewBtn" class="p-2.5 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full transition"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>

    <!-- Dynamic Preview Canvas -->
    <div class="w-full max-w-4xl max-h-[80vh] flex items-center justify-center p-2" id="previewContainer">
      <!-- Media dynamically inserted here -->
    </div>

    <div id="previewTitle" class="mt-3 text-white text-sm font-medium bg-black/40 px-4 py-1.5 rounded-full">--</div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed top-20 right-6 z-50 space-y-2 pointer-events-none"></div>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    // Initial Mock Data Structure
    const initialFiles = [
      { id: '1', name: '我的图片', isFolder: true, size: '--', date: '2026-03-10 14:20', type: 'folder', parentId: 'root' },
      { id: '2', name: '工作文档', isFolder: true, size: '--', date: '2026-03-12 09:15', type: 'folder', parentId: 'root' },
      { id: '3', name: '高清演示视频.mp4', isFolder: false, size: '42.8 MB', date: '2026-03-14 18:30', type: 'video', parentId: 'root', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
      { id: '4', name: '项目设计策划案.pdf', isFolder: false, size: '2.4 MB', date: '2026-03-15 11:05', type: 'document', parentId: 'root' },
      { id: '5', name: '轻松背景音乐.mp3', isFolder: false, size: '5.1 MB', date: '2026-03-16 16:45', type: 'audio', parentId: 'root', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
      { id: '6', name: '风景壁纸.jpg', isFolder: false, size: '3.8 MB', date: '2026-03-16 17:10', type: 'image', parentId: '1', url: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1200&q=80' },
      { id: '7', name: '会议记录.txt', isFolder: false, size: '12 KB', date: '2026-03-17 10:00', type: 'document', parentId: '2', content: '关于云盘系统升级与新功能讨论：\n1. 增加了本地预览功能。\n2. 增加百度网盘风格界面。' }
    ];

    // App State Management
    let files = JSON.parse(localStorage.getItem('baidu_netdisk_files')) || initialFiles;
    let currentFolderId = 'root';
    let currentCategory = 'all'; // all, image, document, video, audio, other, share, trash
    let selectedFileIds = new Set();
    let currentViewMode = 'list'; // list or grid
    let searchKeyword = '';

    // Cache DOM Elements
    const fileListBody = document.getElementById('fileListBody');
    const gridView = document.getElementById('gridView');
    const listView = document.getElementById('listView');
    const emptyState = document.getElementById('emptyState');
    const breadcrumb = document.getElementById('breadcrumb');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const selectionActions = document.getElementById('selectionActions');
    const trashActions = document.getElementById('trashActions');
    const fileCountText = document.getElementById('fileCountText');

    // Save to LocalStorage
    function saveState() {
      localStorage.setItem('baidu_netdisk_files', JSON.stringify(files));
      updateStorageWidget();
    }

    // Helper: File Type Icon Getter
    function getFileIcon(type, isFolder) {
      if (isFolder) return '<i class="fa-solid fa-folder text-amber-400 text-xl"></i>';
      switch (type) {
        case 'image': return '<i class="fa-solid fa-file-image text-blue-500 text-xl"></i>';
        case 'video': return '<i class="fa-solid fa-file-video text-purple-500 text-xl"></i>';
        case 'audio': return '<i class="fa-solid fa-file-audio text-amber-500 text-xl"></i>';
        case 'document': return '<i class="fa-solid fa-file-lines text-emerald-500 text-xl"></i>';
        default: return '<i class="fa-solid fa-file text-slate-400 text-xl"></i>';
      }
    }

    // Toast Notifications
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `p-3 px-4 rounded-xl shadow-lg text-sm font-medium flex items-center space-x-2 transition-all transform duration-300 translate-y-2 opacity-0 text-white ${
        type === 'error' ? 'bg-rose-500' : type === 'success' ? 'bg-emerald-500' : 'bg-slate-800'
      }`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info'}"></i><span>${message}</span>`;
      
      const container = document.getElementById('toastContainer');
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Storage Quota Bar Update
    function updateStorageWidget() {
      let totalBytes = 0;
      files.forEach(f => {
        if (!f.inTrash && !f.isFolder) {
          const sizeVal = parseFloat(f.size) || 1;
          totalBytes += f.size.includes('MB') ? sizeVal * 1024 * 1024 : sizeVal * 1024;
        }
      });
      const usedGB = (totalBytes / (1024 * 1024 * 1024)).toFixed(2);
      document.getElementById('storageText').innerText = `${usedGB} GB / 100 GB`;
      const pct = Math.max(2, Math.min(100, (usedGB / 100) * 100));
      document.getElementById('storageBar').style.width = `${pct}%`;
    }

    // Filter Files Based on Navigation Context
    function getFilteredFiles() {
      return files.filter(f => {
        // Trash category filter
        if (currentCategory === 'trash') {
          return f.inTrash;
        }
        if (f.inTrash) return false;

        // Search Keyword filter
        if (searchKeyword.trim() !== '') {
          return f.name.toLowerCase().includes(searchKeyword.toLowerCase());
        }

        // Standard Navigation Categories
        if (currentCategory === 'all') {
          return f.parentId === currentFolderId;
        } else if (currentCategory === 'share') {
          return f.shared;
        } else {
          return f.type === currentCategory && !f.isFolder;
        }
      });
    }

    // Render Main File Display
    function renderFiles() {
      const activeFiles = getFilteredFiles();
      fileListBody.innerHTML = '';
      gridView.innerHTML = '';
      selectAllCheckbox.checked = false;
      selectedFileIds.clear();
      updateSelectionUI();

      if (activeFiles.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }

      fileCountText.innerText = `已加载 ${activeFiles.length} 个项目`;

      activeFiles.forEach(file => {
        // Render List Row
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition border-b border-slate-100 group cursor-pointer";
        tr.innerHTML = `
          <td class="py-3 text-center" onclick="event.stopPropagation()">
            <input type="checkbox" data-id="${file.id}" class="file-checkbox rounded text-baidu focus:ring-baidu w-4 h-4 cursor-pointer">
          </td>
          <td class="py-3 flex items-center space-x-3">
            ${getFileIcon(file.type, file.isFolder)}
            <span class="font-medium text-slate-700 hover:text-baidu truncate max-w-xs">${file.name}</span>
          </td>
          <td class="py-3 text-slate-400 text-xs hidden md:table-cell">${file.size}</td>
          <td class="py-3 text-slate-400 text-xs hidden sm:table-cell">${file.date}</td>
          <td class="py-3 text-right pr-2">
            <div class="opacity-0 group-hover:opacity-100 transition flex items-center justify-end space-x-2">
              ${currentCategory === 'trash' ? `
                <button title="还原" onclick="event.stopPropagation(); restoreFile('${file.id}')" class="p-1.5 hover:bg-slate-200 text-emerald-600 rounded-md"><i class="fa-solid fa-rotate-left"></i></button>
                <button title="彻底删除" onclick="event.stopPropagation(); permanentlyDelete('${file.id}')" class="p-1.5 hover:bg-slate-200 text-rose-600 rounded-md"><i class="fa-solid fa-xmark"></i></button>
              ` : `
                ${!file.isFolder ? `<button title="下载" onclick="event.stopPropagation(); downloadFile('${file.id}')" class="p-1.5 hover:bg-slate-200 text-slate-600 rounded-md"><i class="fa-solid fa-download"></i></button>` : ''}
                <button title="分享" onclick="event.stopPropagation(); openShareModal('${file.id}')" class="p-1.5 hover:bg-slate-200 text-slate-600 rounded-md"><i class="fa-solid fa-share-nodes"></i></button>
                <button title="删除" onclick="event.stopPropagation(); deleteFile('${file.id}')" class="p-1.5 hover:bg-slate-200 text-rose-600 rounded-md"><i class="fa-solid fa-trash-can"></i></button>
              `}
            </div>
          </td>
        `;

        // Click row action
        tr.addEventListener('click', (e) => handleFileClick(file, e));
        fileListBody.appendChild(tr);

        // Render Grid Card
        const card = document.createElement('div');
        card.className = "border border-slate-200 rounded-xl p-3 flex flex-col items-center justify-between hover:shadow-md transition bg-white relative group cursor-pointer";
        card.innerHTML = `
          <div class="absolute top-2 left-2" onclick="event.stopPropagation()">
            <input type="checkbox" data-id="${file.id}" class="file-checkbox rounded text-baidu focus:ring-baidu w-4 h-4 cursor-pointer">
          </div>
          <div class="my-4 text-4xl">
            ${getFileIcon(file.type, file.isFolder)}
          </div>
          <div class="w-full text-center">
            <div class="text-xs font-semibold text-slate-700 truncate w-full" title="${file.name}">${file.name}</div>
            <div class="text-[10px] text-slate-400 mt-1">${file.isFolder ? '文件夹' : file.size}</div>
          </div>
        `;
        card.addEventListener('click', (e) => handleFileClick(file, e));
        gridView.appendChild(card);
      });

      // Attach checkbox change listeners
      document.querySelectorAll('.file-checkbox').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const id = e.target.getAttribute('data-id');
          if (e.target.checked) selectedFileIds.add(id);
          else selectedFileIds.delete(id);
          updateSelectionUI();
        });
      });

      renderBreadcrumb();
      updateCategoryButtons();
    }

    // Handle Folder Navigation or Lightbox Preview
    function handleFileClick(file, event) {
      if (file.isFolder) {
        currentFolderId = file.id;
        renderFiles();
      } else {
        openPreviewModal(file);
      }
    }

    // Update Selection Actions Bar
    function updateSelectionUI() {
      if (selectedFileIds.size > 0) {
        if (currentCategory === 'trash') {
          trashActions.classList.remove('hidden');
          trashActions.classList.add('flex');
          selectionActions.classList.add('hidden');
        } else {
          selectionActions.classList.remove('hidden');
          selectionActions.classList.add('flex');
          trashActions.classList.add('hidden');
        }
      } else {
        selectionActions.classList.add('hidden');
        selectionActions.classList.remove('flex');
        trashActions.classList.add('hidden');
      }
    }

    // Breadcrumb Navigation Rendering
    function renderBreadcrumb() {
      breadcrumb.innerHTML = '';
      if (currentCategory !== 'all') {
        const catMap = { image: '图片', document: '文档', video: '视频', audio: '音乐', other: '其他', share: '我的分享', trash: '回收站' };
        breadcrumb.innerHTML = `<span class="font-medium text-slate-700">${catMap[currentCategory] || '分类列表'}</span>`;
        return;
      }

      let path = [];
      let curr = currentFolderId;
      while (curr && curr !== 'root') {
        const folder = files.find(f => f.id === curr);
        if (folder) {
          path.unshift(folder);
          curr = folder.parentId;
        } else break;
      }

      // Root Home link
      const rootItem = document.createElement('span');
      rootItem.className = "hover:text-baidu cursor-pointer font-medium";
      rootItem.innerText = "全部文件";
      rootItem.onclick = () => { currentFolderId = 'root'; renderFiles(); };
      breadcrumb.appendChild(rootItem);

      path.forEach((f, idx) => {
        const sep = document.createElement('span');
        sep.className = "text-slate-300 mx-1";
        sep.innerHTML = '<i class="fa-solid fa-chevron-right text-[10px]"></i>';
        breadcrumb.appendChild(sep);

        const item = document.createElement('span');
        item.className = idx === path.length - 1 ? "font-semibold text-slate-700" : "hover:text-baidu cursor-pointer";
        item.innerText = f.name;
        item.onclick = () => { currentFolderId = f.id; renderFiles(); };
        breadcrumb.appendChild(item);
      });
    }

    // Update Active Navigation Sidebar Highlight
    function updateCategoryButtons() {
      document.querySelectorAll('.nav-item').forEach(btn => {
        const nav = btn.getAttribute('data-nav');
        if (nav === currentCategory) {
          btn.className = "nav-item flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-baidu text-white shadow-sm shadow-blue-200";
        } else {
          btn.className = "nav-item flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition";
        }
      });

      // Show/Hide Top Bar Upload & Create Folder Buttons in Trash View
      const uploadBtn = document.getElementById('uploadBtn');
      const newFolderBtn = document.getElementById('newFolderBtn');
      if (currentCategory === 'trash') {
        uploadBtn.classList.add('hidden');
        newFolderBtn.classList.add('hidden');
      } else {
        uploadBtn.classList.remove('hidden');
        newFolderBtn.classList.remove('hidden');
      }
    }

    // ==================== ACTIONS & FEATURES ====================

    // Sort Files
    function sortFiles(key) {
      files.sort((a, b) => {
        if (a.isFolder && !b.isFolder) return -1;
        if (!a.isFolder && b.isFolder) return 1;
        if (key === 'name') return a.name.localeCompare(b.name, 'zh-CN');
        if (key === 'date') return new Date(b.date) - new Date(a.date);
        return 0;
      });
      renderFiles();
    }

    // Delete Single File (Move to Trash)
    function deleteFile(id) {
      const target = files.find(f => f.id === id);
      if (target) {
        target.inTrash = true;
        saveState();
        renderFiles();
        showToast(`"${target.name}" 已移至回收站`, 'info');
      }
    }

    // Restore File from Trash
    function restoreFile(id) {
      const target = files.find(f => f.id === id);
      if (target) {
        target.inTrash = false;
        saveState();
        renderFiles();
        showToast(`已还原 "${target.name}"`, 'success');
      }
    }

    // Permanently Delete File
    function permanentlyDelete(id) {
      files = files.filter(f => f.id !== id);
      saveState();
      renderFiles();
      showToast("文件已彻底删除", 'error');
    }

    // Download Simulation
    function downloadFile(id) {
      const target = files.find(f => f.id === id);
      if (!target) return;
      if (target.url) {
        const a = document.createElement('a');
        a.href = target.url;
        a.download = target.name;
        a.click();
      } else {
        showToast(`开始下载 "${target.name}"`, 'success');
      }
    }

    // New Folder Modal Handling
    const folderModal = document.getElementById('folderModal');
    document.getElementById('newFolderBtn').onclick = () => folderModal.classList.replace('hidden', 'flex');
    document.getElementById('cancelFolderBtn').onclick = () => folderModal.classList.replace('flex', 'hidden');
    document.getElementById('confirmFolderBtn').onclick = () => {
      const nameInput = document.getElementById('newFolderName');
      const name = nameInput.value.trim() || '新建文件夹';
      const newFolder = {
        id: Date.now().toString(),
        name,
        isFolder: true,
        size: '--',
        date: new Date().toISOString().slice(0, 16).replace('T', ' '),
        type: 'folder',
        parentId: currentFolderId
      };
      files.unshift(newFolder);
      saveState();
      renderFiles();
      folderModal.classList.replace('flex', 'hidden');
      nameInput.value = '新建文件夹';
      showToast('成功创建文件夹', 'success');
    };

    // File Upload Handler (Simulated Progress Drawer)
    const fileInput = document.getElementById('fileInput');
    document.getElementById('uploadBtn').onclick = () => fileInput.click();

    fileInput.addEventListener('change', (e) => {
      handleFilesUpload(e.target.files);
    });

    function handleFilesUpload(uploadedFiles) {
      if (!uploadedFiles || uploadedFiles.length === 0) return;
      
      const drawer = document.getElementById('uploadDrawer');
      const uploadList = document.getElementById('uploadList');
      drawer.classList.remove('translate-y-full', 'opacity-0');

      Array.from(uploadedFiles).forEach(file => {
        const uploadId = Date.now() + Math.random().toString();
        const fileType = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : file.type.startsWith('audio/') ? 'audio' : 'document';
        const formattedSize = (file.size / (1024 * 1024)).toFixed(2) + ' MB';

        // Add upload item card to drawer
        const item = document.createElement('div');
        item.id = `upload-${uploadId}`;
        item.className = "bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs space-y-1.5";
        item.innerHTML = `
          <div class="flex justify-between font-medium text-slate-700">
            <span class="truncate w-48">${file.name}</span>
            <span id="speed-${uploadId}" class="text-slate-400">0 KB/s</span>
          </div>
          <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
            <div id="bar-${uploadId}" class="bg-baidu h-full w-0 transition-all duration-200"></div>
          </div>
        `;
        uploadList.appendChild(item);

        // Simulate upload animation
        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.floor(Math.random() * 25) + 10;
          const speed = (Math.random() * 5 + 2).toFixed(1);
          document.getElementById(`speed-${uploadId}`).innerText = `${speed} MB/s`;

          if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            document.getElementById(`bar-${uploadId}`).style.width = '100%';
            document.getElementById(`speed-${uploadId}`).innerText = '完成';
            document.getElementById(`speed-${uploadId}`).className = 'text-emerald-500 font-semibold';

            // Local Object URL for preview if media
            const fileUrl = URL.createObjectURL(file);

            // Add File to Grid / List Data
            files.unshift({
              id: uploadId,
              name: file.name,
              isFolder: false,
              size: formattedSize,
              date: new Date().toISOString().slice(0, 16).replace('T', ' '),
              type: fileType,
              parentId: currentFolderId,
              url: fileUrl
            });
            saveState();
            renderFiles();
          } else {
            document.getElementById(`bar-${uploadId}`).style.width = `${progress}%`;
          }
        }, 300);
      });
    }

    // Drag and Drop Upload Support
    const dropZone = document.getElementById('dropZone');
    const dropOverlay = document.getElementById('dropOverlay');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropOverlay.classList.remove('hidden');
        dropOverlay.classList.add('flex');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropOverlay.classList.add('hidden');
        dropOverlay.classList.remove('flex');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      handleFilesUpload(files);
    });

    document.getElementById('closeUploadDrawer').onclick = () => {
      document.getElementById('uploadDrawer').classList.add('translate-y-full', 'opacity-0');
    };

    // File Share Modal Logic
    let currentShareFile = null;
    const shareModal = document.getElementById('shareModal');
    
    function openShareModal(fileId) {
      currentShareFile = files.find(f => f.id === fileId);
      if (!currentShareFile) return;

      document.getElementById('shareFileName').innerText = currentShareFile.name;
      document.getElementById('shareCode').value = Math.random().toString(36).substring(2, 6).toLowerCase();
      document.getElementById('shareResultBox').classList.add('hidden');
      shareModal.classList.replace('hidden', 'flex');
    }

    document.getElementById('closeShareModal').onclick = () => shareModal.classList.replace('flex', 'hidden');
    document.getElementById('generateShareBtn').onclick = () => {
      const code = document.getElementById('shareCode').value || '1234';
      const shareUrl = `https://pan.baidu.com/s/1a82kX9_${currentShareFile.id} 提取码: ${code}`;
      document.getElementById('generatedShareUrl').value = shareUrl;
      document.getElementById('shareResultBox').classList.remove('hidden');

      // Mark file as shared
      currentShareFile.shared = true;
      saveState();

      // Copy link
      document.getElementById('generatedShareUrl').select();
      document.execCommand('copy');
      showToast('分享链接及提取码已成功复制到剪贴板', 'success');
    };

    // Media Lightbox Previewer Modal
    const previewModal = document.getElementById('previewModal');
    const previewContainer = document.getElementById('previewContainer');
    const previewTitle = document.getElementById('previewTitle');

    function openPreviewModal(file) {
      previewContainer.innerHTML = '';
      previewTitle.innerText = file.name;

      if (file.type === 'image') {
        const img = document.createElement('img');
        img.src = file.url || 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1200&q=80';
        img.className = 'max-h-[75vh] rounded-lg shadow-2xl object-contain';
        previewContainer.appendChild(img);
      } else if (file.type === 'video') {
        const video = document.createElement('video');
        video.src = file.url || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4';
        video.controls = true;
        video.autoplay = true;
        video.className = 'max-h-[75vh] w-full rounded-lg shadow-2xl';
        previewContainer.appendChild(video);
      } else if (file.type === 'audio') {
        const audio = document.createElement('audio');
        audio.src = file.url || 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
        audio.controls = true;
        audio.autoplay = true;
        audio.className = 'w-full max-w-md my-10';
        previewContainer.appendChild(audio);
      } else {
        const docBox = document.createElement('div');
        docBox.className = 'bg-white text-slate-800 p-6 rounded-xl max-w-xl w-full max-h-[60vh] overflow-y-auto font-mono text-sm shadow-2xl';
        docBox.innerText = file.content || `[文档文件预览]\n文件名: ${file.name}\n文件大小: ${file.size}\n修改时间: ${file.date}\n\n该文档格式支持在线阅读预览。`;
        previewContainer.appendChild(docBox);
      }

      previewModal.classList.replace('hidden', 'flex');
    }

    document.getElementById('closePreviewBtn').onclick = () => {
      previewContainer.innerHTML = '';
      previewModal.classList.replace('flex', 'hidden');
    };

    // View Switcher Handlers
    const listViewBtn = document.getElementById('listViewBtn');
    const gridViewBtn = document.getElementById('gridViewBtn');

    listViewBtn.onclick = () => {
      currentViewMode = 'list';
      listView.classList.remove('hidden');
      gridView.classList.add('hidden');
      listViewBtn.className = "px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-700 bg-white shadow-sm transition";
      gridViewBtn.className = "px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-500 hover:text-slate-700 transition";
    };

    gridViewBtn.onclick = () => {
      currentViewMode = 'grid';
      gridView.classList.remove('hidden');
      listView.classList.add('hidden');
      gridViewBtn.className = "px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-700 bg-white shadow-sm transition";
      listViewBtn.className = "px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-500 hover:text-slate-700 transition";
    };

    // Sidebar Category Links Handler
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        currentCategory = item.getAttribute('data-nav');
        currentFolderId = 'root';
        renderFiles();
      });
    });

    // Search Input Realtime Listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchKeyword = e.target.value;
      renderFiles();
    });

    // Batch Delete
    document.getElementById('batchDeleteBtn').onclick = () => {
      selectedFileIds.forEach(id => deleteFile(id));
      selectedFileIds.clear();
      updateSelectionUI();
    };

    // Empty Trash
    document.getElementById('emptyTrashBtn').onclick = () => {
      files = files.filter(f => !f.inTrash);
      saveState();
      renderFiles();
      showToast('回收站已清空', 'success');
    };

    // Select All Checkbox
    selectAllCheckbox.addEventListener('change', (e) => {
      const active = getFilteredFiles();
      selectedFileIds.clear();
      if (e.target.checked) {
        active.forEach(f => selectedFileIds.add(f.id));
      }
      document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = e.target.checked);
      updateSelectionUI();
    });

    // Application Initialization
    window.onload = () => {
      renderFiles();
      updateStorageWidget();
    };
  </script>
</body>
</html>
